name: audit-runtimes

on:
  schedule:
    # Ahead of the Monday 08:00 bump check, so a CVE disclosed against an
    # already-pinned runtime is surfaced as "bump this" rather than blocking
    # whatever PR happens to run next.
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      runtime:
        description: "Runtime id to audit, or 'all'"
        required: true
        default: "all"

concurrency:
  group: audit-runtimes
  cancel-in-progress: false

permissions:
  contents: read

env:
  GRYPE_VERSION: v0.98.0

jobs:
  prepare-matrix:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - id: matrix
        uses: ./.github/actions/runtime-matrix
        with:
          runtime: ${{ github.event.inputs.runtime || 'all' }}

  # Usually the first run of a new ISO week, so usually the run that refreshes
  # the cached database; the cells below then restore the fresh entry instead of
  # scanning with a week-old one. Like the CI primer, this is the only writer.
  grype-db:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/runtime-build-env
        with:
          grype: always
          db-refresh: "true"

  audit:
    needs:
      - prepare-matrix
      - grype-db
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    # The cell builds the container image too, and its buildx cache lives in
    # GHCR. Job-level permissions replace the workflow map, so `contents: read`
    # has to be repeated here.
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare-matrix.outputs.matrix) }}
    env:
      BUILD_BEST_EFFORT_AUDIT: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/runtime-build-env
        id: build-env
        with:
          runtime: ${{ matrix.runtime }}
          arch: ${{ matrix.arch }}
          # The whole point of this workflow is the scan.
          grype: always
          # Cells only read the week's database; the grype-db job writes it.
          db-refresh: "false"
      - name: Log in to GHCR
        # The buildx cache ref is a private GHCR package. Without credentials
        # buildx asks GHCR for an anonymous token and gets 403, which fails the
        # cell on main — the only ref that writes the cache.
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and audit runtime package
        uses: ./.github/actions/build-and-audit-runtime
        with:
          runtime: ${{ matrix.runtime }}
          arch: ${{ matrix.arch }}
          # audit-runtime builds the layer on demand, so no separate build step.
          skip-build: "true"
          # The whole point of this workflow is the scan.
          audit: "true"