name: audit-runtimes

on:
  schedule:
    # Ahead of the Monday 08:00 bump check, so a CVE disclosed against an
    # already-pinned runtime is surfaced as "bump this" rather than blocking
    # whatever PR happens to run next.
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      runtime:
        description: "Runtime id to audit, or 'all'"
        required: true
        default: "all"

concurrency:
  group: audit-runtimes
  cancel-in-progress: false

permissions:
  contents: read

env:
  GRYPE_VERSION: v0.98.0
  # Supply-chain tooling, pinned so a release can be reproduced.
  SYFT_VERSION: v1.57.0
  COSIGN_VERSION: v3.1.4
  ORAS_VERSION: v1.3.6

jobs:
  prepare-matrix:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - id: matrix
        uses: ./.github/actions/runtime-matrix
        with:
          runtime: ${{ github.event.inputs.runtime || 'all' }}

  # Usually the first run of a new ISO week, so usually the run that refreshes
  # the cached database; the cells below then restore the fresh entry instead of
  # scanning with a week-old one. Like the CI primer, this is the only writer.
  grype-db:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/runtime-build-env
        with:
          db-refresh: "true"

  audit:
    needs:
      - prepare-matrix
      - grype-db
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    # The `gha` build cache needs no registry permission and this workflow pushes
    # nothing. Job-level permissions replace the workflow map, so `contents: read`
    # has to be repeated here.
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare-matrix.outputs.matrix) }}
    env:
      BUILD_BEST_EFFORT_AUDIT: "0"
      # registry1.dso.mil needs credentials. Empty means "no Iron Bank login",
      # which makes build-container fall back to the Red Hat UBI9 registry — the
      # same userland — instead of failing the cell. These are repository secrets,
      # so a scheduled audit reads them without an environment gate.
      # Resolved once here so the login step and `build-container`'s fallback
      # check cannot disagree about whether Iron Bank credentials exist.
      IRONBANK_TOKEN: ${{ secrets.IRONBANK_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/runtime-build-env
        id: build-env
        with:
          runtime: ${{ matrix.runtime }}
          arch: ${{ matrix.arch }}
          # The whole point of this workflow is the scan.
          # Cells only read the week's database; the grype-db job writes it.
          db-refresh: "false"
      - name: Log in to Iron Bank Registry
        # Retried: registry1.dso.mil answers `context deadline exceeded` often
        # enough that one attempt fails a healthy cell. A cell that never reaches
        # it fails here rather than quietly auditing the Red Hat mirror.
        if: ${{ env.IRONBANK_TOKEN != '' }}
        shell: bash
        env:
          IRONBANK_USERNAME: ${{ secrets.IRONBANK_USERNAME }}
          RETRY_DELAY: "15"
        run: |
          source tools/bin/_common.sh
          ib_login() {
            printf '%s' "${IRONBANK_TOKEN}" \
              | docker login registry1.dso.mil --username "${IRONBANK_USERNAME}" --password-stdin
          }
          if ! common::retry 4 ib_login; then
            echo "registry1.dso.mil did not answer after 4 attempts" >&2
            exit 1
          fi
      - name: Build and audit runtime package
        uses: ./.github/actions/build-and-audit-runtime
        with:
          runtime: ${{ matrix.runtime }}
          arch: ${{ matrix.arch }}
          # The image and its compliance bundle are this workflow's output.
          container: "true"