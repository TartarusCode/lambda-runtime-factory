name: audit-runtimes

on:
  schedule:
    # Ahead of the Monday 08:00 bump check, so a CVE disclosed against an
    # already-pinned runtime is surfaced as "bump this" rather than blocking
    # whatever PR happens to run next.
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      runtime:
        description: "Runtime id to audit, or 'all'"
        required: true
        default: "all"

concurrency:
  group: audit-runtimes
  cancel-in-progress: false

permissions:
  contents: read

env:
  GRYPE_VERSION: v0.98.0

jobs:
  prepare-matrix:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - id: matrix
        env:
          INPUT_RUNTIME: ${{ github.event.inputs.runtime }}
        # Same generator as CI, so deprecated runtimes are excluded here too.
        run: |
          echo "matrix=$(python3 tools/runtime_lib/runtime_manifest.py matrix --runtime "${INPUT_RUNTIME:-all}")" >> "$GITHUB_OUTPUT"

  audit:
    needs: prepare-matrix
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare-matrix.outputs.matrix) }}
    env:
      BUILD_BEST_EFFORT_AUDIT: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/runtime-build-env
        id: build-env
        with:
          runtime: ${{ matrix.runtime }}
          arch: ${{ matrix.arch }}
          # The whole point of this workflow is the scan.
          grype: always
      - name: Install archive tooling
        run: |
          if ! command -v zip >/dev/null || ! command -v unzip >/dev/null; then
            sudo apt-get update && sudo apt-get install -y zip unzip
          fi
      # audit-runtime builds the layer on demand, so no separate build step.
      - name: Audit runtime package
        run: bash tools/bin/audit-runtime "${{ matrix.runtime }}" "${{ matrix.arch }}"