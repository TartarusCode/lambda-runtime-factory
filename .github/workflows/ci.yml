name: ci

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
  # Two tiers. `opened`/`synchronize`/`reopened` feed the fast tier; `labeled`,
  # `unlabeled` and `ready_for_review` are how a PR graduates to the full matrix
  # when it gains the `ready-to-merge` label or leaves draft.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
    paths-ignore:
      - "**.md"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GRYPE_VERSION: v0.98.0
  # The container smoke test runs the same pinned emulator everywhere.
  AWS_LAMBDA_RIE_VERSION: v1.38

jobs:
  prepare-matrix:
    if: ${{ !(github.event_name == 'pull_request' && github.actor == 'dependabot[bot]') }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      # The matrix action is resolved from the workspace, so the checkout has to
      # happen here rather than inside it.
      - uses: actions/checkout@v7
        with:
          # The fast PR tier diffs the branch against the base branch, which needs
          # that branch in the history.
          fetch-depth: 0
      - id: matrix
        uses: ./.github/actions/runtime-matrix
        with:
          # The full 24-cell matrix is for a push to main, a workflow_dispatch, or
          # a PR that left draft and carries `ready-to-merge`. A draft or
          # unlabelled PR runs only the runtimes whose files changed (one canary
          # cell when the change is tooling-only), so a WIP commit cannot occupy
          # every runner.
          changed-only: >-
            ${{ github.event_name == 'pull_request' &&
                (github.event.pull_request.draft == true ||
                 !contains(github.event.pull_request.labels.*.name, 'ready-to-merge')) }}

  repo-checks:
    # Deliberately runs for dependabot PRs too: it is ~10s and it is the only
    # thing validating an action bump before it merges.
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Validate manifests
        run: bash tools/bin/validate-runtimes
      - name: Validate shell scripts
        run: |
          for script in tools/bin/*; do
            [[ -f "${script}" ]] || continue
            bash -n "${script}"
          done
      - name: Validate Python sources
        run: |
          for runtime in $(python3 tools/runtime_lib/runtime_manifest.py list); do
            bash tools/bin/check-runtime "${runtime}" x86_64
          done
      - name: Validate upstream archive URLs
        # A stale derived field (e.g. release_tag) resolves to a 404 the build
        # only hits minutes later, per matrix cell. Catch it here instead.
        run: python3 tools/runtime_lib/runtime_manifest.py validate --online
      - name: Run runtime_lib tests
        run: |
          pip install -r requirements-dev.txt
          python3 -m pytest tools/runtime_lib/tests -q

  # The Grype vulnerability database is ~2.8GB and identical for every matrix
  # cell. Downloading it once here (and caching it) avoids paying ~60s per cell;
  # a warm restore is ~10s and the scan itself is ~1s.
  grype-db:
    if: ${{ !(github.event_name == 'pull_request' && github.actor == 'dependabot[bot]') }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # This job is the week's only database writer: it refreshes the entry the
      # matrix cells then restore instead of racing to download it. The refresh
      # is skipped when the week's entry already exists, since an immutable cache
      # entry can never be re-saved and the update would be discarded.
      - uses: ./.github/actions/runtime-build-env
        with:
          # This job exists to refresh the database, so it always prepares it.
          grype: always
          db-refresh: "true"

  runtime-checks:
    if: ${{ !(github.event_name == 'pull_request' && github.actor == 'dependabot[bot]') }}
    needs:
      - prepare-matrix
      - repo-checks
      - grype-db
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    # The buildx registry cache lives in GHCR, so a cell reads it on every run
    # and writes it on main. Job-level permissions replace the workflow map, so
    # `contents: read` has to be repeated here.
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare-matrix.outputs.matrix) }}
    env:
      SAM_CLI_TELEMETRY: "0"
      BUILD_BEST_EFFORT_AUDIT: "0"
      # registry1.dso.mil needs credentials; empty makes build-container fall back
      # to the Red Hat UBI9 registry, so the Iron Bank artifact is still built and
      # smoke-tested on an external PR.
      IRONBANK_TOKEN: ${{ secrets.IRONBANK_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/runtime-build-env
        id: build-env
        with:
          runtime: ${{ matrix.runtime }}
          arch: ${{ matrix.arch }}
          grype: when-changed
          # Cells only read the week's database; the grype-db job writes it.
          db-refresh: "false"
      - name: Log in to GHCR
        # The buildx cache ref is a private GHCR package. Without credentials
        # buildx asks GHCR for an anonymous token and gets 403, which fails the
        # cell on main — the only ref that writes the cache.
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Log in to Iron Bank Registry
        if: ${{ env.IRONBANK_TOKEN != '' }}
        uses: docker/login-action@v3
        with:
          registry: registry1.dso.mil
          username: ${{ secrets.IRONBANK_USERNAME }}
          password: ${{ secrets.IRONBANK_TOKEN }}
      - name: Build and audit runtime package
        uses: ./.github/actions/build-and-audit-runtime
        with:
          runtime: ${{ matrix.runtime }}
          arch: ${{ matrix.arch }}
          # Skipped when the package cache hit: the pinned archive, our bootstrap and
          # helpers and the build script are all unchanged, so rebuilding only repeats
          # the same extraction and zip (up to ~80s for rust). The restored zip still
          # feeds the SAM example and the artifact upload.
          skip-build: ${{ steps.build-env.outputs.package-cache-hit == 'true' }}
          # Skipped when this cell's archive was already cached: the findings come
          # only from the pinned upstream payload, so an unchanged archive can only
          # report CVE-database drift that no commit caused. That drift is caught by
          # the weekly audit-runtimes workflow instead of blocking unrelated PRs.
          audit: ${{ steps.build-env.outputs.audit }}
          # CI exercises both artifacts: the zip layer and the Iron Bank UBI9 image,
          # including a scan of the image and a rootless, read-only smoke test. A
          # container regression cannot reach a release unseen.
          container: "true"
      - name: Install SAM CLI
        if: matrix.arch == 'x86_64' && !matrix.skip_local_invoke
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install SAM CLI dependencies
        if: matrix.arch == 'x86_64' && !matrix.skip_local_invoke
        run: pip install -r requirements-ci.txt
      - name: Warm SAM build image
        if: matrix.arch == 'x86_64' && !matrix.skip_local_invoke
        # SAM resolves an arch-suffixed tag (public.ecr.aws/sam/build-provided.al2023:
        # latest-<arch>), and that is a different image from the multi-arch `latest`
        # list: on x86 they share 1 of 15 layers, so pulling bare `:latest` warms
        # 734MB SAM never uses and leaves it to fetch ~695MB of its own.
        run: docker pull "public.ecr.aws/sam/build-provided.al2023:latest-${{ matrix.arch }}"
      - name: Build local SAM example
        if: matrix.arch == 'x86_64' && !matrix.skip_local_invoke
        run: make local-build RUNTIME=${{ matrix.runtime }} ARCH=${{ matrix.arch }}
      - name: Invoke local SAM example
        if: matrix.arch == 'x86_64' && !matrix.skip_local_invoke
        run: make local-invoke RUNTIME=${{ matrix.runtime }} ARCH=${{ matrix.arch }}
      - name: Upload runtime artifact
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.runtime }}-${{ matrix.arch }}-artifact
          path: ${{ runner.temp }}/lambda-runtime-monorepo/${{ matrix.runtime }}/${{ matrix.arch }}/artifacts/*.zip
          retention-days: 7
