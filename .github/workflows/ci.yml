name: ci

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GRYPE_VERSION: v0.98.0

jobs:
  prepare-matrix:
    if: ${{ !(github.event_name == 'pull_request' && github.actor == 'dependabot[bot]') }}
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - id: matrix
        run: echo "matrix=$(python3 tools/runtime_lib/runtime_manifest.py matrix)" >> "$GITHUB_OUTPUT"

  repo-checks:
    if: ${{ !(github.event_name == 'pull_request' && github.actor == 'dependabot[bot]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Validate manifests
        run: bash tools/bin/validate-runtimes
      - name: Validate shell scripts
        run: |
          for script in tools/bin/*; do
            [[ -f "${script}" ]] || continue
            bash -n "${script}"
          done
      - name: Validate Python sources
        run: |
          for runtime in $(python3 tools/runtime_lib/runtime_manifest.py list); do
            bash tools/bin/check-runtime "${runtime}" x86_64
          done
      - name: Validate upstream archive URLs
        # A stale derived field (e.g. release_tag) resolves to a 404 the build
        # only hits minutes later, per matrix cell. Catch it here instead.
        run: python3 tools/runtime_lib/runtime_manifest.py validate --online
      - name: Run runtime_lib tests
        run: |
          pip install pytest pytest-mock
          python3 -m pytest tools/runtime_lib/tests -q

  # The Grype vulnerability database is ~2.8GB and identical for every matrix
  # cell. Downloading it once here (and caching it) avoids paying ~60s per cell;
  # a warm restore is ~10s and the scan itself is ~1s.
  grype-db:
    if: ${{ !(github.event_name == 'pull_request' && github.actor == 'dependabot[bot]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Compute database cache key
        id: dbkey
        # The database is independent of the Grype binary version, so key it on
        # the week only — a tool bump must not invalidate 2.8GB of cache.
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - name: Restore Grype database
        uses: actions/cache@v6
        with:
          path: ~/.cache/grype
          key: grype-db-${{ runner.os }}-${{ steps.dbkey.outputs.week }}
          restore-keys: |
            grype-db-${{ runner.os }}-
      - name: Install Grype
        run: |
          mkdir -p "${RUNNER_TEMP}/grype/bin"
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh \
            | sh -s -- -b "${RUNNER_TEMP}/grype/bin" "${GRYPE_VERSION}"
      - name: Update vulnerability database
        # Best effort: a failed refresh must not block the matrix, which falls
        # back to a previous week's database or a cold download.
        continue-on-error: true
        run: "${RUNNER_TEMP}/grype/bin/grype db update"

  runtime-checks:
    if: ${{ !(github.event_name == 'pull_request' && github.actor == 'dependabot[bot]') }}
    needs:
      - prepare-matrix
      - repo-checks
      - grype-db
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare-matrix.outputs.matrix) }}
    env:
      SAM_CLI_TELEMETRY: "0"
      BUILD_BEST_EFFORT_AUDIT: "0"
    steps:
      - uses: actions/checkout@v7
      - name: Prepare cache directories
        run: |
          echo "DOWNLOAD_CACHE_DIR=${RUNNER_TEMP}/lambda-runtime-monorepo/cache/downloads" >> "$GITHUB_ENV"
          echo "GRYPE_INSTALL_DIR=${RUNNER_TEMP}/grype/bin" >> "$GITHUB_ENV"
          mkdir -p "${RUNNER_TEMP}/lambda-runtime-monorepo/cache/downloads"
          mkdir -p "${RUNNER_TEMP}/grype/bin"
      - name: Compute database cache key
        id: dbkey
        # Must match the key produced by the grype-db job.
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - name: Cache runtime downloads
        uses: actions/cache@v6
        with:
          path: ${{ env.DOWNLOAD_CACHE_DIR }}
          key: downloads-${{ runner.os }}-${{ matrix.runtime }}-${{ matrix.arch }}-${{ hashFiles(format('runtimes/{0}/runtime.json', matrix.runtime), format('runtimes/{0}/checksums/**', matrix.runtime)) }}
      - name: Cache Grype binary
        uses: actions/cache@v6
        with:
          path: ${{ env.GRYPE_INSTALL_DIR }}
          key: grype-binary-${{ runner.os }}-${{ matrix.runner }}-${{ env.GRYPE_VERSION }}
      - name: Cache Grype database
        uses: actions/cache@v6
        with:
          path: ~/.cache/grype
          key: grype-db-${{ runner.os }}-${{ steps.dbkey.outputs.week }}
          restore-keys: |
            grype-db-${{ runner.os }}-
      - name: Install Grype
        run: |
          if [[ ! -x "${GRYPE_INSTALL_DIR}/grype" ]]; then
            curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b "${GRYPE_INSTALL_DIR}" "${GRYPE_VERSION}"
          fi
          echo "${GRYPE_INSTALL_DIR}" >> "$GITHUB_PATH"
      - name: Install archive tooling
        # ubuntu runners ship zip/unzip; only install when actually missing.
        run: |
          if ! command -v zip >/dev/null || ! command -v unzip >/dev/null; then
            sudo apt-get update && sudo apt-get install -y zip unzip
          fi
      - name: Build runtime package
        run: make build RUNTIME=${{ matrix.runtime }} ARCH=${{ matrix.arch }}
      - name: Audit runtime package
        run: bash tools/bin/audit-runtime "${{ matrix.runtime }}" "${{ matrix.arch }}"
      - name: Install SAM CLI
        if: matrix.arch == 'x86_64' && !matrix.skip_local_invoke
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install SAM CLI dependencies
        if: matrix.arch == 'x86_64' && !matrix.skip_local_invoke
        run: pip install -r requirements-ci.txt
      - name: Warm SAM build image
        if: matrix.arch == 'x86_64' && !matrix.skip_local_invoke
        run: docker pull public.ecr.aws/sam/build-provided.al2023:latest
      - name: Build local SAM example
        if: matrix.arch == 'x86_64' && !matrix.skip_local_invoke
        run: make local-build RUNTIME=${{ matrix.runtime }} ARCH=${{ matrix.arch }}
      - name: Invoke local SAM example
        if: matrix.arch == 'x86_64' && !matrix.skip_local_invoke
        run: make local-invoke RUNTIME=${{ matrix.runtime }} ARCH=${{ matrix.arch }}
      - name: Upload runtime artifact
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.runtime }}-${{ matrix.arch }}-artifact
          path: ${{ runner.temp }}/lambda-runtime-monorepo/${{ matrix.runtime }}/${{ matrix.arch }}/artifacts/*.zip
          retention-days: 7
