name: ci

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
  # Two tiers. `opened`/`synchronize`/`reopened` feed the fast tier; `labeled`,
  # `unlabeled` and `ready_for_review` are how a PR graduates to the full matrix
  # when it gains the `ready-to-merge` label or leaves draft.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
    paths-ignore:
      - "**.md"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GRYPE_VERSION: v0.98.0
  # Supply-chain tooling, pinned so a release can be reproduced.
  SYFT_VERSION: v1.57.0
  COSIGN_VERSION: v3.1.4
  ORAS_VERSION: v1.3.6
  # The container smoke test runs the same pinned emulator everywhere.
  AWS_LAMBDA_RIE_VERSION: v1.38

jobs:
  prepare-matrix:
    if: ${{ !(github.event_name == 'pull_request' && github.actor == 'dependabot[bot]') }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      # The matrix action is resolved from the workspace, so the checkout has to
      # happen here rather than inside it.
      - uses: actions/checkout@v7
        with:
          # The fast PR tier diffs the branch against the base branch, which needs
          # that branch in the history.
          fetch-depth: 0
      - id: matrix
        uses: ./.github/actions/runtime-matrix
        with:
          # The full matrix is for a push to main, a workflow_dispatch, or
          # a PR that left draft and carries `ready-to-merge`. A draft or
          # unlabelled PR runs only the runtimes whose files changed (one canary
          # cell when the change is tooling-only), so a WIP commit cannot occupy
          # every runner.
          changed-only: >-
            ${{ github.event_name == 'pull_request' &&
                (github.event.pull_request.draft == true ||
                 !contains(github.event.pull_request.labels.*.name, 'ready-to-merge')) }}

  repo-checks:
    # Deliberately runs for dependabot PRs too: it is ~10s and it is the only
    # thing validating an action bump before it merges.
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Validate manifests
        run: python3 tools/runtime_lib/runtime_manifest.py validate
      - name: Validate shell scripts
        run: |
          for script in tools/bin/*; do
            [[ -f "${script}" ]] || continue
            bash -n "${script}"
          done
      - name: Validate Python sources
        run: |
          for runtime in $(python3 tools/runtime_lib/runtime_manifest.py list); do
            python3 tools/runtime_lib/runtime_manifest.py check --runtime "${runtime}" --arch x86_64
          done
      - name: Validate upstream archive URLs
        # A stale derived field (e.g. release_tag) resolves to a 404 the build
        # only hits minutes later, per matrix cell. Catch it here instead.
        run: python3 tools/runtime_lib/runtime_manifest.py validate --online
      - name: Run runtime_lib tests
        run: |
          pip install -r requirements-dev.txt
          python3 -m pytest tools/runtime_lib/tests -q

      - name: Note a retired UBI-lag waiver
        # A waiver that retires changes what the images carry: the next build installs
        # the patched RPM, so the images already published carry the vulnerable
        # package until a release runs. A green CI run is the one place a reader would
        # not otherwise learn that, so the summary says it here.
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          changed=$(gh api "repos/${GITHUB_REPOSITORY}/compare/${BEFORE}...${AFTER}" \
            --jq '.files[].filename' 2>/dev/null || true)
          if ! grep -qx 'tools/compliance/ubi-lag-waivers.json' <<< "${changed}"; then
            echo "No UBI-lag waiver change in this push."
            exit 0
          fi
          {
            echo "## ⚠️ UBI9 Security Waiver Retired"
            echo
            echo '`tools/compliance/ubi-lag-waivers.json` changed in this push. The next build installs the'
            echo 'patched RPM and the scan reports the package clean, but the images published from this commit'
            echo 'are still the pre-patch build. Cut a `release-*` tag, or dispatch `release-runtime.yml`, to'
            echo 'publish patched digests to ECR Public and GHCR.'
          } >> "${GITHUB_STEP_SUMMARY}"
          echo "::warning::A UBI9 security waiver was retired; publish a release to ship the patched images."

  # The Grype vulnerability database is ~2.8GB and identical for every matrix
  # cell. Downloading it once here (and caching it) avoids paying ~60s per cell;
  # a warm restore is ~10s and the scan itself is ~1s.
  grype-db:
    if: ${{ !(github.event_name == 'pull_request' && github.actor == 'dependabot[bot]') }}
    uses: ./.github/workflows/grype-db.yml

  runtime-checks:
    if: ${{ !(github.event_name == 'pull_request' && github.actor == 'dependabot[bot]') }}
    needs:
      - prepare-matrix
      - repo-checks
      - grype-db
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    # The `gha` build cache needs no registry permission and the cell pushes
    # nothing, so `contents: read` is the whole grant. Job-level permissions
    # replace the workflow map, so it has to be repeated here.
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare-matrix.outputs.matrix) }}
    env:
      SAM_CLI_TELEMETRY: "0"
      BUILD_BEST_EFFORT_AUDIT: "0"
      # registry1.dso.mil needs credentials; empty makes build-container fall back
      # to the Red Hat UBI9 registry, so the Iron Bank artifact is still built and
      # smoke-tested on an external PR.
      # Resolved once here so the login step and `build-container`'s fallback
      # check read the same variable. These are repository secrets, so every job in
      # this repository reads them; a fork's PR has none, and the fallback covers it.
      IRONBANK_TOKEN: ${{ secrets.IRONBANK_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/runtime-build-env
        id: build-env
        with:
          runtime: ${{ matrix.runtime }}
          arch: ${{ matrix.arch }}
          # Cells only read the week's database; the grype-db job writes it.
          db-refresh: "false"
      - name: Log in to Iron Bank Registry
        # The retry and the credential names live in the shared action, so every
        # call site logs in the same way the build decides whether it has a token.
        if: ${{ env.IRONBANK_TOKEN != '' }}
        uses: ./.github/actions/iron-bank-login
        with:
          token: ${{ secrets.IRONBANK_TOKEN }}
          username: ${{ secrets.IRONBANK_USERNAME }}
      - name: Build and audit runtime package
        uses: ./.github/actions/build-and-audit-runtime
        with:
          runtime: ${{ matrix.runtime }}
          arch: ${{ matrix.arch }}
          container: "true"
