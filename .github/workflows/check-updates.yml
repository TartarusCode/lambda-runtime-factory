name: check-runtime-updates

on:
  schedule:
    - cron: "0 8 * * 1"  # Every Monday at 08:00 UTC
  workflow_dispatch:
    inputs:
      runtime:
        description: "Runtime ID to check (blank for all)"
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write

jobs:
  check-and-bump:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      # Authenticated GitHub API calls avoid the unauthenticated 60 req/h limit
      # that makes version checks fail intermittently.
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Check for upstream updates
        id: check
        run: |
          args=(check --json --prune-waivers)
          if [[ -n "${{ github.event.inputs.runtime }}" ]]; then
            args+=(--runtime "${{ github.event.inputs.runtime }}")
          fi
          python3 tools/runtime_lib/bump_version.py "${args[@]}" > "${RUNNER_TEMP}/check_output.txt" 2>&1
          cat "${RUNNER_TEMP}/check_output.txt"

          python3 << 'PYCHECK'
          import json, os
          text = open(os.environ["RUNNER_TEMP"] + "/check_output.txt").read()
          # Extract JSON block: collect lines from first { to last }
          lines = text.splitlines()
          start = next((i for i, l in enumerate(lines) if l.strip().startswith("{")), None)
          end = next((i for i in range(len(lines) - 1, -1, -1) if lines[i].strip().startswith("}")), None)
          data = {}
          if start is not None and end is not None:
              data = json.loads("\n".join(lines[start:end + 1]))
          outdated = data.get("outdated", {})
          new_lines = data.get("new_lines", {})
          retired = data.get("retired_waivers", [])
          json.dump({"outdated": outdated, "new_lines": new_lines, "retired_waivers": retired},
                    open(os.environ["RUNNER_TEMP"] + "/updates.json", "w"))
          output = open(os.environ["GITHUB_OUTPUT"], "a")
          # A retired waiver is an update even in a week where no runtime tarball
          # moved: the deletion has to reach a pull request, because the waiver is
          # what stops the build failing on an unobtainable fix.
          output.write(f"updates_found={'true' if (outdated or new_lines or retired) else 'false'}\n")
          output.write(f"retired={'true' if retired else 'false'}\n")
          PYCHECK

      - name: Bump outdated runtimes and add new lines
        id: bump
        if: steps.check.outputs.updates_found == 'true'
        # A runtime that cannot be updated (upstream archive renamed, transient
        # network error) must not discard the bumps that already succeeded.
        continue-on-error: true
        run: |
          args=(bump-latest --failures-json "${RUNNER_TEMP}/bump_failures.json")
          if [[ -n "${{ github.event.inputs.runtime }}" ]]; then
            args+=(--runtime "${{ github.event.inputs.runtime }}")
          fi
          python3 tools/runtime_lib/bump_version.py "${args[@]}"

      - name: Compose the pull request title
        id: title
        if: steps.check.outputs.updates_found == 'true'
        # The title is the only place a reviewer sees that this batch retires a
        # security acknowledgement and therefore needs a release behind it.
        run: >-
          python3 tools/runtime_lib/update_report.py title
          --updates "${RUNNER_TEMP}/updates.json" >> "${GITHUB_OUTPUT}"

      - name: Ensure the release-required label exists
        if: steps.check.outputs.retired == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # A pull request cannot carry a label the repository has not defined, and the
        # first retirement in a fresh clone would fail rather than warn. `--force`
        # makes this idempotent and keeps the colour and description current.
        run: |
          gh label create release-required --force --color B60205 \
            --description "Merging retires a security waiver and needs a release"

      - name: Build PR description
        if: steps.check.outputs.updates_found == 'true'
        run: >-
          python3 tools/runtime_lib/update_report.py body
          --updates "${RUNNER_TEMP}/updates.json"
          --failures "${RUNNER_TEMP}/bump_failures.json"
          --out "${RUNNER_TEMP}/pr_body.txt"

      - name: Create pull request
        if: steps.check.outputs.updates_found == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: bump runtime distribution versions and add new lines"
          branch: automated/bump-runtime-versions
          delete-branch: true
          title: ${{ steps.title.outputs.title }}
          # `release-required` exists by now: the step above creates it before this
          # one runs, because a missing label fails the whole pull request.
          labels: >-
            dependencies,automated${{ steps.check.outputs.retired == 'true' && ',release-required' || '' }}
          # The waiver deletion must travel with the bump, and nothing else in the
          # tree should ride along.
          add-paths: |
            runtimes/**
            README.md
            tools/compliance/ubi-lag-waivers.json
          body-path: ${{ runner.temp }}/pr_body.txt

      - name: Report skipped runtimes
        # Run after the PR exists, then fail the job so skipped runtimes are
        # visible as a red run rather than being silently dropped.
        if: steps.check.outputs.updates_found == 'true' && steps.bump.outcome == 'failure'
        run: |
          echo "::error::Some runtimes could not be updated — see the PR's 'Skipped Runtimes' section."
          if [[ -f "${RUNNER_TEMP}/bump_failures.json" ]]; then
            cat "${RUNNER_TEMP}/bump_failures.json"
          fi
          exit 1
