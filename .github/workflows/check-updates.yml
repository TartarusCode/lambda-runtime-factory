name: check-runtime-updates

on:
  schedule:
    - cron: "0 8 * * 1"  # Every Monday at 08:00 UTC
  workflow_dispatch:
    inputs:
      runtime:
        description: "Runtime ID to check (blank for all)"
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write

jobs:
  check-and-bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Check for upstream updates
        id: check
        run: |
          args=(check --json)
          if [[ -n "${{ github.event.inputs.runtime }}" ]]; then
            args+=(--runtime "${{ github.event.inputs.runtime }}")
          fi
          python3 tools/runtime_lib/bump_version.py "${args[@]}" > "${RUNNER_TEMP}/check_output.txt" 2>&1
          cat "${RUNNER_TEMP}/check_output.txt"

          python3 << 'PYCHECK'
          import json, os
          text = open(os.environ["RUNNER_TEMP"] + "/check_output.txt").read()
          # Extract JSON block: collect lines from first { to last }
          lines = text.splitlines()
          start = next((i for i, l in enumerate(lines) if l.strip().startswith("{")), None)
          end = next((i for i in range(len(lines) - 1, -1, -1) if lines[i].strip().startswith("}")), None)
          data = {}
          if start is not None and end is not None:
              data = json.loads("\n".join(lines[start:end + 1]))
          outdated = data.get("outdated", {})
          new_lines = data.get("new_lines", {})
          output = open(os.environ["GITHUB_OUTPUT"], "a")
          if outdated or new_lines:
              json.dump({"outdated": outdated, "new_lines": new_lines},
                        open(os.environ["RUNNER_TEMP"] + "/updates.json", "w"))
              output.write("outdated=true\n")
          else:
              output.write("outdated=false\n")
          PYCHECK

      - name: Bump outdated runtimes and add new lines
        if: steps.check.outputs.outdated == 'true'
        run: |
          args=(bump-latest)
          if [[ -n "${{ github.event.inputs.runtime }}" ]]; then
            args+=(--runtime "${{ github.event.inputs.runtime }}")
          fi
          python3 tools/runtime_lib/bump_version.py "${args[@]}"

      - name: Build PR description
        if: steps.check.outputs.outdated == 'true'
        run: |
          python3 << 'PYBODY'
          import json, os
          tmp = os.environ["RUNNER_TEMP"]
          updates = json.load(open(tmp + "/updates.json"))
          lines = ["## Runtime Version Bumps", "",
                   "The following runtimes were updated to their latest upstream versions:", ""]
          for rid, info in sorted(updates.get("outdated", {}).items()):
              lines.append(f"- **{rid}**: {info['current']} → {info['latest']}")
          new_lines = updates.get("new_lines", {})
          if new_lines:
              lines += ["", "## New Runtime Lines", "",
                        "New runtime packages were created for newly available version lines:", ""]
              for family, info in sorted(new_lines.items()):
                  lines.append(f"- **{info['id']}**: new {family} line {info['line']} at version {info['version']}")
          lines += ["", "Checksums were fetched from the official upstream release channels.",
                    "", "## Test Plan",
                    "- [ ] CI validates manifests and checksums",
                    "- [ ] CI builds all updated runtime packages",
                    "- [ ] CI audits updated packages with Grype"]
          open(tmp + "/pr_body.txt", "w").write("\n".join(lines) + "\n")
          PYBODY

      - name: Create pull request
        if: steps.check.outputs.outdated == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: bump runtime distribution versions and add new lines"
          branch: automated/bump-runtime-versions
          delete-branch: true
          title: "chore: bump runtime distribution versions and add new lines"
          body-path: ${{ runner.temp }}/pr_body.txt
          labels: dependencies,automated
