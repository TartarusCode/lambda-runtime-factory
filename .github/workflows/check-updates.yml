name: check-runtime-updates

on:
  schedule:
    - cron: "0 8 * * 1"  # Every Monday at 08:00 UTC
  workflow_dispatch:
    inputs:
      runtime:
        description: "Runtime ID to check (blank for all)"
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write

jobs:
  check-and-bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Check for upstream updates
        id: check
        run: |
          args=(check --json)
          if [[ -n "${{ github.event.inputs.runtime }}" ]]; then
            args+=(--runtime "${{ github.event.inputs.runtime }}")
          fi
          python3 tools/runtime_lib/bump_version.py "${args[@]}" > "${RUNNER_TEMP}/check_output.txt" 2>&1
          cat "${RUNNER_TEMP}/check_output.txt"

          python3 -c "
          import json, sys
          text = open('${RUNNER_TEMP}/check_output.txt').read()
          for line in reversed(text.splitlines()):
              line = line.strip()
              if line.startswith('{'):
                  data = json.loads(line)
                  if data:
                      open('${RUNNER_TEMP}/updates.json', 'w').write(json.dumps(data))
                      print('outdated=true')
                  else:
                      print('outdated=false')
                  sys.exit(0)
          print('outdated=false')
          " >> "$GITHUB_OUTPUT"

      - name: Bump outdated runtimes
        if: steps.check.outputs.outdated == 'true'
        run: |
          args=(bump-latest)
          if [[ -n "${{ github.event.inputs.runtime }}" ]]; then
            args+=(--runtime "${{ github.event.inputs.runtime }}")
          fi
          python3 tools/runtime_lib/bump_version.py "${args[@]}"

      - name: Build PR description
        if: steps.check.outputs.outdated == 'true'
        run: |
          python3 -c "
          import json
          updates = json.load(open('${RUNNER_TEMP}/updates.json'))
          lines = ['## Runtime Version Bumps', '',
                   'The following runtimes were updated to their latest upstream versions:', '']
          for rid, info in sorted(updates.items()):
              lines.append(f'- **{rid}**: {info[\"current\"]} \u2192 {info[\"latest\"]}')
          lines += ['', 'Checksums were fetched from the official upstream release channels.',
                    '', '## Test Plan',
                    '- [ ] CI validates manifests and checksums',
                    '- [ ] CI builds all updated runtime packages',
                    '- [ ] CI audits updated packages with Grype']
          open('${RUNNER_TEMP}/pr_body.txt', 'w').write('\n'.join(lines) + '\n')
          "

      - name: Create pull request
        if: steps.check.outputs.outdated == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: bump runtime distribution versions"
          branch: automated/bump-runtime-versions
          delete-branch: true
          title: "chore: bump runtime distribution versions"
          body-path: ${{ runner.temp }}/pr_body.txt
          labels: dependencies,automated
