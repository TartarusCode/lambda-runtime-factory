name: release-runtime

# Two ways in, one pipeline.
#   * Push a `release-YYYY.MM.DD` tag: the tag is the immutable record of the
#     commit that was published, and it is what a re-run re-publishes.
#   * Dispatch: an ad-hoc or partial republish (runtime / arch / publicize).
#     Dispatch with `dry_run: true` to exercise the whole path — the credential
#     preflight, the build and the scan — without uploading to S3 or creating a
#     layer version, which is the only way to reach the preflight's secret and
#     role checks without publishing anything.
# The workflow deliberately never creates the tag itself — a tag pushed with
# GITHUB_TOKEN does not trigger workflows, so "tag then publish" and "publish
# then tag" cannot both work. The tag is the input.
on:
  workflow_dispatch:
    inputs:
      runtime:
        description: "Runtime id to publish, or 'all'"
        required: true
        default: "all"
      arch:
        description: "Architecture to publish: x86_64, arm64, or 'all'"
        required: true
        default: "all"
      publicize:
        description: "Grant public layer permissions after publish"
        required: true
        default: false
        type: boolean
      dry_run:
        description: "Build and scan only; skip the S3 upload and the publish"
        required: true
        default: false
        type: boolean
      publish_soci:
        description: "Also publish SOCI-enabled image copies (<tag>-soci) for Lambda Managed Instances"
        required: true
        default: false
        type: boolean
  push:
    tags:
      - "release-*"

# Publishing mutates S3 and creates Lambda layer versions, so runs are queued
# rather than cancelled: a second dispatch waits instead of killing a publish
# mid-flight.
concurrency:
  group: release-runtime
  cancel-in-progress: false

permissions:
  contents: read
  # The preflight asks the API for this commit's CI conclusion.
  actions: read
  # Credentials are assumed through OIDC; the repo holds no long-lived AWS keys.
  id-token: write
  # Container images publish to GHCR with the workflow token.
  packages: write

env:
  GRYPE_VERSION: v0.98.0
  # Supply-chain tooling, pinned so a release can be reproduced.
  SYFT_VERSION: v1.57.0
  COSIGN_VERSION: v3.1.4
  ORAS_VERSION: v1.3.6
  # The container smoke test runs the same pinned emulator everywhere.
  AWS_LAMBDA_RIE_VERSION: v1.38
  # The manifest names the ECR Public alias the project publishes under; a custom
  # alias can sit pending in the console, so a repository variable can point the
  # release at the account's current alias without a code change. Empty means "use
  # the manifest".
  ECR_PUBLIC_ALIAS: ${{ vars.ECR_PUBLIC_ALIAS }}

jobs:
  prepare-matrix:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      container-matrix: ${{ steps.containers.outputs.matrix }}
      merge-matrix: ${{ steps.merge.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      # Same generator CI uses, so the runner labels and the deprecated-runtime
      # filter cannot drift from the rest of the pipeline. A tag-triggered run
      # has no workflow_dispatch inputs, so this resolves to every runtime and
      # architecture.
      - id: matrix
        uses: ./.github/actions/runtime-matrix
        with:
          runtime: ${{ github.event.inputs.runtime || 'all' }}
          arch: ${{ github.event.inputs.arch || 'all' }}
      - id: containers
        uses: ./.github/actions/runtime-matrix
        with:
          runtime: ${{ github.event.inputs.runtime || 'all' }}
          arch: ${{ github.event.inputs.arch || 'all' }}
          # Containers are the opposite answer to the same quota: a 10 GB
          # uncompressed ceiling, so every runtime publishes an image — including
          # the Go and Rust toolchains that can never be a layer.
          layer-publishable-only: "false"
      - id: merge
        uses: ./.github/actions/runtime-matrix
        with:
          runtime: ${{ github.event.inputs.runtime || 'all' }}
          # One cell per runtime: the merge combines both architectures, so
          # running it per arch would repeat the same manifest edit twice.
          arch: x86_64
          layer-publishable-only: "false"

  # The publish cells only restore the database, so they need the entry primed
  # first: a manual release must not scan against a week-old database just because
  # no push happened to refresh it. Like the CI primer, this is the only writer.
  grype-db:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/runtime-build-env
        with:
          db-refresh: "true"

  # One job validates everything that would otherwise fail in every cell.
  # aws-actions/configure-aws-credentials retries credential loading 12 times
  # (~51s) before giving up, so a role that cannot be assumed is discovered here
  # in ~1 minute instead of costing ~20 minutes of wall clock across the matrix.
  preflight:
    needs:
      - prepare-matrix
    # Carrying the environment keeps this job's OIDC subject stable —
    # repo:<owner>/<repo>:environment:release — whether the run came from a
    # branch dispatch or a tag.
    environment: release
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Validate the release tag
        if: github.ref_type == 'tag'
        run: |
          tag="${GITHUB_REF_NAME}"
          if [[ ! "${tag}" =~ ^release-[0-9]{4}\.[0-9]{2}\.[0-9]{2}(-[0-9]+)?$ ]]; then
            echo "::error::Tag '${tag}' is not a release tag. Expected release-YYYY.MM.DD, optionally suffixed -2, -3 for a second release on the same day."
            exit 1
          fi

      # An empty matrix would otherwise be a green no-op: the run reports success
      # having published nothing, which reads as "released" to anyone watching.
      - name: Refuse an empty publish matrix
        env:
          MATRIX: ${{ needs.prepare-matrix.outputs.matrix }}
        run: |
          count=$(python3 -c 'import json,os; print(len(json.loads(os.environ["MATRIX"])["include"]))')
          if [[ "${count}" -eq 0 ]]; then
            echo "::error::the publish matrix is empty — every requested runtime is deprecated, so there is nothing to publish."
            exit 1
          fi

      - name: Validate the release role secret
        env:
          AWS_RELEASE_ROLE_ARN: ${{ secrets.AWS_RELEASE_ROLE_ARN }}
        run: |
          if [[ -z "${AWS_RELEASE_ROLE_ARN}" ]]; then
            echo "::error::AWS_RELEASE_ROLE_ARN is not set. Set it to the role that trusts this repository's OIDC provider."
            exit 1
          fi
          # Stating the subject up front is what makes a trust-policy mismatch a
          # one-line diagnosis: the role must allow this exact sub, or a wildcard.
          echo "Assuming ${AWS_RELEASE_ROLE_ARN} through OIDC."
          echo "This job presents the subject repo:${GITHUB_REPOSITORY}:environment:release"

      - name: Require a green CI run for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          conclusion=$(gh run list --commit "${GITHUB_SHA}" --workflow ci.yml \
            --limit 1 --json conclusion --jq '.[0].conclusion // "none"')
          if [[ "${conclusion}" != "success" ]]; then
            echo "::error::ci.yml has not succeeded for ${GITHUB_SHA} (conclusion: ${conclusion}); refusing to publish a revision the build and scan never validated."
            exit 1
          fi

      - name: Assume the release role
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_RELEASE_ROLE_ARN }}
          aws-region: us-east-1

      - name: Confirm the identity
        run: aws sts get-caller-identity

  publish-containers:
    needs:
      - prepare-matrix
      - grype-db
      - preflight
    environment: release
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    # Job-level permissions replace the workflow map, so every scope is repeated.
    permissions:
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare-matrix.outputs.container-matrix) }}
    env:
      BUILD_BEST_EFFORT_AUDIT: "0"
      # registry1.dso.mil needs credentials. Empty means "no Iron Bank login",
      # which makes build-container fall back to the Red Hat UBI9 registry — the
      # same userland — instead of failing every cell.
      # Resolved once here so the login step and `build-container`'s fallback
      # check read the same variable and cannot disagree about whether Iron Bank
      # credentials exist.
      IRONBANK_TOKEN: ${{ secrets.IRONBANK_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: ./.github/actions/runtime-build-env
        id: build-env
        with:
          runtime: ${{ matrix.runtime }}
          arch: ${{ matrix.arch }}
          # A published image must be gated on a fresh scan.
          db-refresh: "false"
      - name: Log in to GHCR
        if: ${{ github.event.inputs.dry_run != 'true' }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Log in to Iron Bank Registry
        # Only when the repository carries the credentials; the fallback base
        # covers every other case. Retried because registry1.dso.mil answers
        # `context deadline exceeded` often enough that one attempt turns a
        # healthy cell into a failed release — but a cell that never reaches it
        # fails here rather than quietly publishing on the Red Hat mirror.
        if: ${{ env.IRONBANK_TOKEN != '' }}
        shell: bash
        env:
          IRONBANK_USERNAME: ${{ secrets.IRONBANK_USERNAME }}
          RETRY_DELAY: "15"
        run: |
          source tools/bin/_common.sh
          ib_login() {
            printf '%s' "${IRONBANK_TOKEN}" \
              | docker login registry1.dso.mil --username "${IRONBANK_USERNAME}" --password-stdin
          }
          if ! common::retry 4 ib_login; then
            echo "registry1.dso.mil did not answer after 4 attempts" >&2
            exit 1
          fi
      - name: Set up Docker Buildx
        # The docker-container driver exposes the job's cache service through
        # `type=gha`, which is how the base pull and the certificate/library
        # staging are reused across runs and architectures; the default docker
        # driver has no BuildKit cache export.
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker-container
      - name: Configure AWS credentials
        # Amazon ECR Public is the copy Lambda can actually pull from, so the
        # image job needs the same OIDC role the layer publish uses.
        if: ${{ github.event.inputs.dry_run != 'true' }}
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_RELEASE_ROLE_ARN }}
          aws-region: us-east-1
      - name: Log in to Amazon ECR Public
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          aws ecr-public get-login-password --region us-east-1 \
            | docker login --username AWS --password-stdin public.ecr.aws
      - name: Ensure the image repositories exist
        # A first push to a new runtime fails on ECR Public unless the repository
        # exists; GHCR creates the package itself.
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: bash tools/bin/ensure-container-repos "${{ matrix.runtime }}"
      - name: Prepare the image build
        env:
          CONTAINER_BUILD_CACHE: gha
        run: |
          timeout 300 bash tools/bin/build-container \
            "${{ matrix.runtime }}" "${{ matrix.arch }}" --prepare-only
      - name: Build the container image
        # `docker/build-push-action` rather than a shell `docker buildx build`:
        # `type=gha` needs the Actions cache runtime variables, which a shell step
        # does not inherit, so the cache flags parse and every layer misses.
        uses: docker/build-push-action@v7
        with:
          context: ${{ env.BUILD_CONTEXT }}
          file: ${{ env.BUILD_DOCKERFILE }}
          platforms: ${{ env.BUILD_PLATFORM }}
          tags: ${{ env.BUILD_IMAGE_TAG }}
          load: true
          labels: |
            org.opencontainers.image.revision=${{ env.BUILD_REVISION }}
          build-args: |
            BASE_IMAGE=${{ env.BUILD_BASE_IMAGE }}
            BUILDER_IMAGE=${{ env.BUILD_BASE_IMAGE }}
            NONROOT_UID=${{ env.BUILD_NONROOT_UID }}
            NONROOT_GID=${{ env.BUILD_NONROOT_GID }}
          cache-from: |
            type=gha,scope=ubi9-base-${{ matrix.arch }}
            type=gha,scope=runtime-${{ matrix.runtime }}-${{ matrix.arch }}
          cache-to: |
            type=gha,mode=max,scope=ubi9-base-${{ matrix.arch }}
            type=gha,mode=max,scope=runtime-${{ matrix.runtime }}-${{ matrix.arch }}
      - name: Measure, smoke-test and scan the image
        # Only bytes that passed every step are pushed. The smoke test runs before
        # the compliance bundle so provenance cites the STIG check it performs.
        run: |
          timeout 900 bash tools/bin/build-container "${{ matrix.runtime }}" "${{ matrix.arch }}" --finish
          timeout 600 bash tools/bin/local-invoke-container "${{ matrix.runtime }}" "${{ matrix.arch }}"
          bash tools/bin/generate-compliance-artifacts "${{ matrix.runtime }}" "${{ matrix.arch }}"
      - name: Check the image contract
        run: bash tools/bin/check-container "${{ matrix.runtime }}" "${{ matrix.arch }}"
      - name: Push the per-architecture image
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: bash tools/bin/push-container "${{ matrix.runtime }}" "${{ matrix.arch }}"
      - name: Publish the SOCI-enabled copy
        # A second image per architecture, not a tag on the first: SOCI Index
        # Manifest v2 bundles the index into a new image, and Lambda lazy-loads the
        # one whose URI it is given. No containerd and no root needed —
        # `soci convert --standalone` works on OCI layouts and oras moves them.
        if: ${{ inputs.publish_soci && github.event.inputs.dry_run != 'true' }}
        env:
          SOCI_VERSION: v0.16.1
          ORAS_VERSION: v1.3.6
        run: bash tools/bin/publish-soci-index "${{ matrix.runtime }}" "${{ matrix.arch }}" --push
      - name: Sign and attest the image
        # Keyless: the OIDC token this job already has becomes a Fulcio
        # certificate, and the SBOMs, CVE report and provenance are attached to
        # the digest that was just pushed. The SOCI copy is a different digest, so
        # it is signed and attested separately — otherwise a consumer running the
        # lazy-loaded image gets an unverifiable one.
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          bash tools/bin/attest-container "${{ matrix.runtime }}" "${{ matrix.arch }}"
          if [ "${{ inputs.publish_soci }}" = "true" ]; then
            bash tools/bin/attest-container "${{ matrix.runtime }}" "${{ matrix.arch }}" --target soci
          fi
      - name: Upload the compliance bundle
        # The same files, without a registry client: this is what an auditor
        # downloads from the release run.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.runtime }}-${{ matrix.arch }}-compliance
          path: |
            ${{ runner.temp }}/lambda-runtime-monorepo/${{ matrix.runtime }}/${{ matrix.arch }}/artifacts/compliance/*
            ${{ runner.temp }}/lambda-runtime-monorepo/${{ matrix.runtime }}/${{ matrix.arch }}/artifacts/container.json
          if-no-files-found: warn
          retention-days: 90

      - name: Report the dry run
        if: ${{ github.event.inputs.dry_run == 'true' }}
        run: |
          echo "::notice::dry run: ${{ matrix.runtime }} (${{ matrix.arch }}) images were built, scanned and smoke-tested; nothing was pushed."

  # Combine the two per-arch images into one multi-arch tag. Done once per
  # runtime, after every architecture has pushed: a manifest list cannot be built
  # from an image that does not exist yet.
  merge-containers:
    needs:
      - prepare-matrix
      - publish-containers
    if: ${{ always() && needs.publish-containers.result == 'success' && github.event.inputs.dry_run != 'true' }}
    environment: release
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    # Job-level permissions replace the workflow map rather than merging with it,
    # so the OIDC grant has to be repeated here. Without `id-token: write` the
    # runner cannot mint a token and `configure-aws-credentials` fails with
    # "Did you mean to set the `id-token` permission?" and then twelve retries of
    # "Could not load credentials from any providers" — which reads like an account
    # problem, not a missing grant, and stops the merge before the tags are made.
    permissions:
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare-matrix.outputs.merge-matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_RELEASE_ROLE_ARN }}
          aws-region: us-east-1
      - name: Log in to Amazon ECR Public
        run: |
          aws ecr-public get-login-password --region us-east-1 \
            | docker login --username AWS --password-stdin public.ecr.aws
      - uses: ./.github/actions/compliance-tools
      - name: Create the multi-arch tags
        # Every registry in the manifest gets the same tags, for the standard
        # image and, when this run published them, the SOCI copies. A dispatch
        # that targeted one architecture leaves the per-arch tags alone with a
        # notice.
        run: |
          arguments=("${{ matrix.runtime }}")
          if [ "${{ inputs.publish_soci }}" = "true" ]; then arguments+=(--soci); fi
          bash tools/bin/merge-container-tags "${arguments[@]}"

      - name: Sign the multi-arch indexes
        # The merged tags are new digests that reference the per-arch manifests, so
        # a consumer pulling `:<version>` and verifying the digest it resolves to
        # checks the index, not the manifest underneath. Signed here, with the
        # bundle left on each platform manifest rather than duplicated onto the
        # index, which describes no single SBOM.
        run: |
          bash tools/bin/attest-container "${{ matrix.runtime }}" "${{ matrix.arch }}" --target merged --sign-only
          if [ "${{ inputs.publish_soci }}" = "true" ]; then
            bash tools/bin/attest-container "${{ matrix.runtime }}" "${{ matrix.arch }}" --target merged-soci --sign-only
          fi


  # SOCI publishing lives in `publish-containers` (per architecture) and
  # `merge-containers` (the multi-arch `-soci` tag), so the conversion runs beside
  # the image it belongs to instead of in a job that re-fetches it.

  record-release:
    needs:
      - prepare-matrix
      # The images are the release artifacts, so the record waits for the
      # multi-arch tags to exist before it names them.
      - merge-containers
    if: ${{ always() && needs.merge-containers.result == 'success' && github.event.inputs.dry_run != 'true' }}
    environment: release
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    # Job-level permissions replace the workflow-level map, so id-token: write
    # has to be repeated here for the OIDC role assumption below.
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_RELEASE_ROLE_ARN }}
          aws-region: us-east-1
      - name: Collect the published image tags
        env:
          MATRIX: ${{ needs.prepare-matrix.outputs.matrix }}
          PUBLISH_SOCI: ${{ inputs.publish_soci }}
        run: |
          python3 - <<'PY' > "${RUNNER_TEMP}/cells.txt"
          import json
          import os

          for cell in json.loads(os.environ["MATRIX"])["include"]:
              print(cell["runtime"], cell["arch"])
          PY
          {
            echo "## Published runtime images"
            echo
            echo "Commit: \`${GITHUB_SHA}\`"
            echo
          } > "${RUNNER_TEMP}/release-notes.md"
          while read -r runtime arch; do
            env_text=$(python3 tools/runtime_lib/runtime_manifest.py env \
              --runtime "${runtime}" --arch "${arch}")
            image=$(grep '^CONTAINER_IMAGE=' <<<"${env_text}" | cut -d= -f2- | tr -d "'")
            tag=$(grep '^CONTAINER_TAG=' <<<"${env_text}" | cut -d= -f2- | tr -d "'")
            {
              echo "- \`${image}:${tag}-${arch}\`"
              # Only name a SOCI index this run actually published; a bullet for
              # one that was never built sends a consumer to a missing tag.
              if [ "${PUBLISH_SOCI}" = "true" ]; then
                echo "- \`${image}:${tag}-${arch}-soci\`"
              fi
            } >> "${RUNNER_TEMP}/release-notes.md"
          done < "${RUNNER_TEMP}/cells.txt"
          cat "${RUNNER_TEMP}/release-notes.md" >> "${GITHUB_STEP_SUMMARY}"

      - name: Collect the published container images
        # The image is the delivery artifact, so the release record names it per
        # runtime. Skipped when the merge job did not run (dry run) or failed:
        # naming an image that was never pushed is worse than omitting it.
        if: ${{ needs.merge-containers.result == 'success' }}
        env:
          MATRIX: ${{ needs.prepare-matrix.outputs.container-matrix }}
        run: |
          python3 - <<'PY' > "${RUNNER_TEMP}/images.txt"
          import json
          import os

          for cell in json.loads(os.environ["MATRIX"])["include"]:
              print(cell["runtime"])
          PY
          # The section goes into the record *and* the run summary. The summary
          # already holds the per-arch tag section written above, so only this
          # section is appended to it, while the record takes the whole file.
          {
            echo "## Published container images"
            echo
            while read -r runtime; do
              env_text=$(python3 tools/runtime_lib/runtime_manifest.py env \
                --runtime "${runtime}" --arch x86_64)
              image=$(grep '^CONTAINER_IMAGE=' <<<"${env_text}" | cut -d= -f2- | tr -d "'")
              tag=$(grep '^CONTAINER_TAG=' <<<"${env_text}" | cut -d= -f2- | tr -d "'")
              echo "- \`${image}:${tag}\`"
            done < "${RUNNER_TEMP}/images.txt"
            echo
          } > "${RUNNER_TEMP}/container-images.md"
          cat "${RUNNER_TEMP}/container-images.md" >> "${RUNNER_TEMP}/release-notes.md"
          cat "${RUNNER_TEMP}/container-images.md" >> "${GITHUB_STEP_SUMMARY}"

      - name: Attach the record to the release tag
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="${RUNNER_TEMP}/release-notes.md"
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release edit "${GITHUB_REF_NAME}" --notes-file "${notes}"
          else
            gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --notes-file "${notes}"
          fi

      - name: Report a dispatch with no tag behind it
        if: github.ref_type == 'branch'
        run: |
          echo "::notice::Dispatched publish with no release tag; the layer arns are in this run's summary. Push a release-YYYY.MM.DD tag to record a release."
