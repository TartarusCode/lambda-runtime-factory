name: release-runtime

on:
  workflow_dispatch:
    inputs:
      runtime:
        description: "Runtime id to publish, or 'all'"
        required: true
        default: "all"
      arch:
        description: "Architecture to publish: x86_64, arm64, or 'all'"
        required: true
        default: "all"
      publicize:
        description: "Grant public layer permissions after publish"
        required: true
        default: false
        type: boolean

# Publishing mutates S3 and creates Lambda layer versions, so runs are queued
# rather than cancelled: a second dispatch waits instead of killing a publish
# mid-flight.
concurrency:
  group: release-runtime
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  GRYPE_VERSION: v0.98.0

jobs:
  prepare-matrix:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - id: matrix
        env:
          INPUT_RUNTIME: ${{ github.event.inputs.runtime }}
          INPUT_ARCH: ${{ github.event.inputs.arch }}
        # Same generator CI uses, so the runner labels and the deprecated-runtime
        # filter cannot drift from the rest of the pipeline.
        run: |
          echo "matrix=$(python3 tools/runtime_lib/runtime_manifest.py matrix --runtime "${INPUT_RUNTIME:-all}" --arch "${INPUT_ARCH:-all}")" >> "$GITHUB_OUTPUT"

  publish:
    needs: prepare-matrix
    # Gating on a repository environment lets required reviewers approve a
    # production publish; add them under Settings -> Environments -> release.
    environment: release
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare-matrix.outputs.matrix) }}
    env:
      SAM_CLI_TELEMETRY: "0"
      BUILD_BEST_EFFORT_AUDIT: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: ./.github/actions/runtime-build-env
        with:
          runtime: ${{ matrix.runtime }}
          arch: ${{ matrix.arch }}
          # Publishing must always be gated on a fresh scan.
          grype: always
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_RELEASE_ROLE_ARN }}
          aws-region: us-east-1
      - name: Build runtime package
        timeout-minutes: 20
        run: make build RUNTIME=${{ matrix.runtime }} ARCH=${{ matrix.arch }}
      - name: Audit runtime package
        run: bash tools/bin/audit-runtime "${{ matrix.runtime }}" "${{ matrix.arch }}"
      - name: Upload runtime artifact to S3
        run: make upload RUNTIME=${{ matrix.runtime }} ARCH=${{ matrix.arch }}
      - name: Publish Lambda layer
        if: ${{ github.event.inputs.publicize != 'true' }}
        run: make publish RUNTIME=${{ matrix.runtime }} ARCH=${{ matrix.arch }}
      - name: Publish and publicize Lambda layer
        if: ${{ github.event.inputs.publicize == 'true' }}
        run: make publicize RUNTIME=${{ matrix.runtime }} ARCH=${{ matrix.arch }}
      - name: Summarize latest layer arns
        run: |
          {
            echo "### ${{ matrix.runtime }} (${{ matrix.arch }})"
            bash tools/bin/latest-runtime "${{ matrix.runtime }}" "${{ matrix.arch }}"
            echo
          } >> "$GITHUB_STEP_SUMMARY"
