name: Runtime matrix
description: >-
  Emit the runtime build matrix from the runtime manifests, so every workflow
  shares one generator, one arch-to-runner-label map and one deprecated-runtime
  filter. A second workflow that hand-rolls this keeps building and publishing
  things the others deliberately exclude.

  Call sites must run actions/checkout first — a repository-local action is
  resolved from the workspace, so it cannot populate the workspace itself.

inputs:
  runtime:
    description: Runtime id to include, or "all"
    required: false
    default: "all"
  arch:
    description: Architecture to include, or "all"
    required: false
    default: "all"
  include-deprecated:
    description: >-
      "true" also emits deprecated runtimes. Only the roll-off tooling should
      ever ask for this; the build and publish matrices exclude them.
    required: false
    default: "false"
  layer-publishable-only:
    description: >-
      "true" drops runtimes that cannot be published as a layer — a deployment
      package is capped at 250 MB unzipped, covering the function and all of its
      layers, so a runtime shipping a whole upstream toolchain cannot be
      delivered that way. Only the publish matrix should ask for this: CI still
      builds and audits those runtimes.
    required: false
    default: "false"
  changed-only:
    description: >-
      "true" narrows the matrix to the runtimes whose files changed against the
      base branch (or, when only tooling or docs changed, to a single canary
      cell). This is the fast PR tier: a work-in-progress commit must not occupy
      all 24 runners before the PR is ready to merge. Requires the caller's
      checkout to have the base branch in its history (fetch-depth: 0).
    required: false
    default: "false"

outputs:
  matrix:
    description: JSON matrix for the `fromJson` matrix expression
    value: ${{ steps.matrix.outputs.matrix }}

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v7
      with:
        python-version: "3.11"

    - name: Generate matrix
      id: matrix
      shell: bash
      env:
        INPUT_RUNTIME: ${{ inputs.runtime }}
        INPUT_ARCH: ${{ inputs.arch }}
      # An empty input (a tag-triggered run has no workflow_dispatch inputs)
      # falls back to "all"; the CLI validates an unknown id and fails loudly.
      run: |
        args=()
        if [[ "${{ inputs.include-deprecated }}" == "true" ]]; then
          args+=(--include-deprecated)
        fi
        if [[ "${{ inputs.layer-publishable-only }}" == "true" ]]; then
          args+=(--layer-publishable-only)
        fi
        runtime="${INPUT_RUNTIME:-all}"
        arch="${INPUT_ARCH:-all}"
        if [[ "${{ inputs.changed-only }}" == "true" ]]; then
          base="origin/${GITHUB_BASE_REF:-main}"
          changed=$(git diff --name-only "${base}...HEAD" 2>/dev/null \
            | grep '^runtimes/' | cut -d/ -f2 | sort -u | paste -sd, - || true)
          if [[ -z "${changed}" ]]; then
            # Nothing under runtimes/ changed (tools, workflows, docs): one canary
            # cell still proves the shared plumbing builds, without 24 runners.
            echo "No runtime files changed against ${base}; running the pypy311 canary cell."
            runtime="pypy311"
            arch="x86_64"
          else
            echo "Changed runtimes against ${base}: ${changed}"
            runtime="${changed}"
          fi
        fi
        matrix=$(python3 tools/runtime_lib/runtime_manifest.py matrix \
          --runtime "${runtime}" \
          --arch "${arch}" \
          "${args[@]}")
        echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"
