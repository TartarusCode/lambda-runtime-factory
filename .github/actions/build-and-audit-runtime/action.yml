name: Build and audit runtime package
description: >-
  Install the archive tooling, build a runtime image and its compliance bundle.
  Shared by the CI matrix, the release matrix and the scheduled audit so the
  build inputs and the scan cannot drift between workflows.

  Every call site runs the same sequence — stage the payload, build the image,
  smoke-test it, generate the bundle — so there is nothing to gate: a cached
  payload would only be rebuilt by the image step that consumes it.

inputs:
  runtime:
    description: Runtime id to build
    required: true
  arch:
    description: Architecture to build
    required: true
  container:
    description: >-
      "true" builds the OCI image from the staged payload, smoke-tests it rootless
      on a read-only rootfs, checks its STIG contract and generates its compliance
      bundle. "false" stages the payload only.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Install archive tooling
      # ubuntu runners ship zip/unzip; only install when actually missing.
      shell: bash
      run: |
        if ! command -v zip >/dev/null || ! command -v unzip >/dev/null; then
          sudo apt-get update && sudo apt-get install -y zip unzip
        fi

    - name: Set up Docker Buildx
      # The docker-container driver exposes the job's cache service through
      # `type=gha`, which is how the base pull, the certificate extraction and the
      # library installation are reused across cells and runs. The default docker
      # driver has no BuildKit cache export at all.
      if: inputs.container == 'true'
      uses: docker/setup-buildx-action@v4
      with:
        driver: docker-container

    - name: Build runtime package
      shell: bash
      # A pathological upstream download must fail fast, not hang the cell.
      # This cannot be a step-level `timeout-minutes`: a composite action's step
      # schema rejects that key and GitHub then refuses to load the whole action
      # ("Unexpected value 'timeout-minutes'") before a single command runs.
      # test_composite_action_steps_only_use_supported_keys keeps it that way.
      env:
        # The summary row is written once, at the end of the action, so it can
        # carry the container image size measured below.
        LAMBDA_RUNTIME_SUMMARY_DEFERRED: "1"
      run: timeout 1200 make build RUNTIME="${{ inputs.runtime }}" ARCH="${{ inputs.arch }}"

    - name: Prepare the image build
      if: inputs.container == 'true'
      shell: bash
      # Renders the Dockerfile and records the tag, base and build args. The build
      # itself is `docker/build-push-action` below: `type=gha` needs the Actions
      # cache runtime variables, and a shell `docker buildx build` does not inherit
      # them — the flags parse fine and every layer is still a miss.
      env:
        LAMBDA_RUNTIME_SUMMARY_DEFERRED: "1"
      run: |
        timeout 300 bash tools/bin/build-container \
          "${{ inputs.runtime }}" "${{ inputs.arch }}" --prepare-only

    - name: Build the container image
      if: inputs.container == 'true'
      uses: docker/build-push-action@v7
      with:
        context: ${{ env.BUILD_CONTEXT }}
        file: ${{ env.BUILD_DOCKERFILE }}
        platforms: ${{ env.BUILD_PLATFORM }}
        tags: ${{ env.BUILD_IMAGE_TAG }}
        # The image has to reach the local daemon: `docker image inspect`, the
        # rootfs measurement, `syft docker:<tag>` and the smoke test all read it
        # from there, and none of them can consume a cache-only export.
        load: true
        labels: |
          org.opencontainers.image.revision=${{ env.BUILD_REVISION }}
        build-args: |
          BASE_IMAGE=${{ env.BUILD_BASE_IMAGE }}
          BUILDER_IMAGE=${{ env.BUILD_BASE_IMAGE }}
          NONROOT_UID=${{ env.BUILD_NONROOT_UID }}
          NONROOT_GID=${{ env.BUILD_NONROOT_GID }}
        # The base scope is runtime-independent, so every runtime on an
        # architecture reuses one ubi9-minimal pull plus microdnf install layer.
        cache-from: |
          type=gha,scope=ubi9-base-${{ inputs.arch }}
          type=gha,scope=runtime-${{ inputs.runtime }}-${{ inputs.arch }}
        cache-to: |
          type=gha,mode=max,scope=ubi9-base-${{ inputs.arch }}
          type=gha,mode=max,scope=runtime-${{ inputs.runtime }}-${{ inputs.arch }}

    - name: Measure the container image
      if: inputs.container == 'true'
      shell: bash
      # Exports the rootfs, asserts the Lambda filesystem and STIG contract, and
      # writes container.json from what the build produced.
      env:
        LAMBDA_RUNTIME_SUMMARY_DEFERRED: "1"
      run: |
        timeout 900 bash tools/bin/build-container \
          "${{ inputs.runtime }}" "${{ inputs.arch }}" --finish


    - name: Smoke-test the container image
      # Runs as the image's non-root user on a read-only rootfs with /tmp as the
      # only writable path, through aws-lambda-rie for a runtime image and through
      # the manifest's own smoke test for a toolchain image.
      if: inputs.container == 'true'
      shell: bash
      run: timeout 600 bash tools/bin/local-invoke-container "${{ inputs.runtime }}" "${{ inputs.arch }}"

    - name: Check the image contract
      # Proves the claims rather than assuming them: non-root UID, the payload's
      # entrypoint, no package manager left, and an intact RPM database.
      if: inputs.container == 'true'
      shell: bash
      run: bash tools/bin/check-container "${{ inputs.runtime }}" "${{ inputs.arch }}"

    - name: Generate the compliance bundle
      # Runs after the smoke test on purpose: the provenance manifest cites the
      # STIG check the smoke test just performed, so generating it earlier would
      # record a claim nothing had proven. Syft reads the image, Grype reads the
      # SPDX document Syft produced, and a fixable High fails the cell.
      if: inputs.container == 'true'
      shell: bash
      run: bash tools/bin/generate-compliance-artifacts "${{ inputs.runtime }}" "${{ inputs.arch }}"

    - name: Record the package size
      # Always: the summary states this cell's payload size and headroom against
      # the deployment ceiling, including when the image build failed.
      if: always()
      shell: bash
      run: >-
        bash .github/actions/build-and-audit-runtime/report-package-size.sh
        "${{ inputs.runtime }}" "${{ inputs.arch }}"
