name: Runtime build environment
description: >-
  Cache the runtime download, the Grype binary and the Grype vulnerability
  database, then install Grype. Shared by the CI matrix, the release matrix and
  the database-prime job so their cache keys cannot drift apart.

inputs:
  runtime:
    description: Runtime id whose archive download should be cached (omit to skip)
    required: false
    default: ""
  arch:
    description: Architecture whose archive download should be cached (omit to skip)
    required: false
    default: ""
  db-refresh:
    description: >-
      "false" (the default) only restores the week's Grype database. "true" makes
      this call site the week's refresher: it runs `grype db update` and saves the
      result under the week's key when that entry does not exist yet. Cache
      entries are immutable, so the refresher must be the only writer — otherwise
      a job that merely restored the previous week's database would freeze a
      stale copy under the new week's key for the rest of the week. Exactly one
      call site per scanning workflow passes "true";
      test_one_database_refresher_per_scanning_workflow enforces that.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Prepare cache directories
      shell: bash
      run: |
        echo "DOWNLOAD_CACHE_DIR=${RUNNER_TEMP}/lambda-runtime-monorepo/cache/downloads" >> "$GITHUB_ENV"
        echo "GRYPE_INSTALL_DIR=${RUNNER_TEMP}/grype/bin" >> "$GITHUB_ENV"
        mkdir -p "${RUNNER_TEMP}/lambda-runtime-monorepo/cache/downloads"
        mkdir -p "${RUNNER_TEMP}/grype/bin"

    - name: Cache runtime downloads
      id: downloads
      if: inputs.runtime != ''
      uses: actions/cache@v6
      with:
        path: ${{ env.DOWNLOAD_CACHE_DIR }}
        key: downloads-${{ runner.os }}-${{ inputs.runtime }}-${{ inputs.arch }}-${{ hashFiles(format('runtimes/{0}/runtime.json', inputs.runtime), format('runtimes/{0}/checksums/**', inputs.runtime)) }}

    - name: Compute database cache key
      id: dbkey
      shell: bash
      # The database is independent of the Grype binary version, so key it on the
      # week only — a tool bump must not invalidate 2.8GB of cache.
      run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

    - name: Cache Grype binary
      uses: actions/cache@v6
      with:
        path: ${{ env.GRYPE_INSTALL_DIR }}
        # runner.arch, not the runner label: the binary is the same across OS
        # releases, so pinning the image must not invalidate this cache.
        key: grype-binary-${{ runner.os }}-${{ runner.arch }}-${{ env.GRYPE_VERSION }}

    - name: Restore Grype database
      id: dbcache
      # Restore-only, never the combined action: a key that already exists is
      # never re-saved, so a combined cache step would make whichever job ran
      # first the week's writer — freezing the previous week's database under the
      # new week's key. Only the refresher below may create the entry.
      uses: actions/cache/restore@v6
      with:
        path: ~/.cache/grype
        key: grype-db-${{ runner.os }}-${{ steps.dbkey.outputs.week }}
        restore-keys: |
          grype-db-${{ runner.os }}-

    - name: Install Grype
      shell: bash
      run: |
        if [[ ! -x "${GRYPE_INSTALL_DIR}/grype" ]]; then
          curl --fail --silent --show-error --location \
            --retry 5 --retry-all-errors --retry-delay 3 --retry-connrefused \
            --connect-timeout 30 \
            https://raw.githubusercontent.com/anchore/grype/main/install.sh \
            | sh -s -- -b "${GRYPE_INSTALL_DIR}" "${GRYPE_VERSION}"
        fi
        echo "${GRYPE_INSTALL_DIR}" >> "$GITHUB_PATH"

    # Syft, Cosign and Oras, installed for this runner's CPU. The merge job signs
    # from the same action, so the architecture mapping exists in one place.
    - uses: ./.github/actions/compliance-tools

    - name: Update vulnerability database
      id: dbupdate
      # Only the default branch may write the shared entry: a cache created on
      # any other ref (a PR's refs/pull/N/merge, a tag) is readable by nothing
      # else, so saving one there costs ~458MB of the repo's 10GB budget and
      # evicts the download and tool caches. Gating the update as well as the save
      # keeps a PR from paying the ~58s refresh for a result that would be
      # discarded.
      if: inputs.db-refresh == 'true' && steps.dbcache.outputs.cache-hit != 'true' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
      shell: bash
      # Best effort: a failed refresh must not block the matrix, which falls back to
      # the database that was just restored. The step records whether the refresh
      # actually happened so the save below cannot cache a stale database.
      run: |
        # The binary path is quoted on its own: quoting the whole command makes
        # bash look for a file literally named "grype db update", which fails
        # with ENOENT while the `if` still reports success.
        if "${GRYPE_INSTALL_DIR}/grype" db update; then
          echo "refreshed=true" >> "$GITHUB_OUTPUT"
        else
          echo "refreshed=false" >> "$GITHUB_OUTPUT"
          # An error annotation, not a warning: this step is `if`-guarded, so a
          # permanently broken refresh would otherwise stay invisible in a green
          # run (it did, for weeks, and no database entry was ever written).
          echo "::error::grype db update failed; this week's database was not refreshed"
        fi

    # Only the refresher writes the entry, and only when it actually refreshed: a
    # failed refresh would otherwise freeze the stale database it fell back to under
    # the new week's key.
    - name: Save vulnerability database
      if: inputs.db-refresh == 'true' && steps.dbcache.outputs.cache-hit != 'true' && steps.dbupdate.outputs.refreshed == 'true' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
      # A concurrent refresher on the same week can win the race to save; the entry
      # it wrote holds the same week's database, so losing here is harmless.
      continue-on-error: true
      uses: actions/cache/save@v6
      with:
        path: ~/.cache/grype
        key: grype-db-${{ runner.os }}-${{ steps.dbkey.outputs.week }}