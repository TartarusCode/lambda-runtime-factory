service: hello-graalpy311


provider:
  name: aws
  region: eu-central-1

functions:
  hello-graalpy311:
    handler: hello.handler
    runtime: provided.al2023
    # Set GRAALPY_LAYER_ARN before deploy, for example:
    # GRAALPY_LAYER_ARN=$(aws lambda list-layer-versions --layer-name graalpy311 --query "LayerVersions[0].LayerVersionArn" --output text --region eu-central-1)
    layers:
      - ${env:GRAALPY_LAYER_ARN}
