service: hello-rust198


provider:
  name: aws
  region: eu-central-1

functions:
  hello-rust198:
    handler: handler
    runtime: provided.al2023
    # Set RUST_LAYER_ARN before deploy, for example:
    # RUST_LAYER_ARN=$(aws lambda list-layer-versions --layer-name rust198 --query "LayerVersions[0].LayerVersionArn" --output text --region eu-central-1)
    layers:
      - ${env:RUST_LAYER_ARN}
